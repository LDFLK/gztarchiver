scrape: # Shared scrape configuration
  url: "https://documents.gov.lk/web/extra_gazettes"

v2: # V2 crawler specific configs
  cdn_proxy_url: "https://documents.gov.lk/api/content-file-proxy?file="
  api_endpoint: "http://gvp-api:4500/website-data/extra-gazette/get-all"
  next_action_token: "7f679bcdf1c679caa0f2356b97387098c39c41312a" #service next action header in the client side (extra_gazettes API call)
  languages:
    - "ENGLISH"

output: # Do not change these
  metadata_dir: "metadata"
  years_json: "metadata/years.json"
  doc_metadata_json: "metadata/doc_metadata.json"
  download_metadata_json: "metadata/download_metadata.json"
  log_record_dir: "records"
  log_success: "successfully_archived.csv"
  log_failure: "failed_to_archive.csv"
  log_unavailable: "document_unavailable.csv"
  log_classification: "document_classification.csv"

archive: # Change on your preference
  archive_location: "path-to-your-local-archive-location" # Local archive location
  archive_base_url: "your-archive-repo-base-url"
  force_download_base_url: "your-rawgithubusercontent-base-url"

credentials: # Change on your preference
  divert_deepseek_api_key: your-deepseek-divert-api-key-from-bijira # Set your key
  divert_url_deep_seek: your-deepseek-divert-url-from-bijira # Set your URL

classification: # Change on your preference
  enable: true # Set to false to skip LLM extraction & categorization

